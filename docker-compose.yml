services:
  app:
    build: .
    ports:
      - "8501:8501"
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://pyfinflow:${DB_PASSWORD}@db:5432/pyfinflow
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - ENVIRONMENT=production
      - OLLAMA_URL=http://ollama:11434
      - CHROMADB_PATH=/chroma/chroma
      - HF_TOKEN=${HF_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - pyfinflow

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: pyfinflow
      POSTGRES_USER: pyfinflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-in-production}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyfinflow -d pyfinflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - pyfinflow

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pyfinflow

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chromadata:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
    restart: unless-stopped
    networks:
      - pyfinflow

volumes:
  pgdata:
  redisdata:
  chromadata:

networks:
  pyfinflow:
    driver: bridge
